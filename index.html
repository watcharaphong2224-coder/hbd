<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday นะครับคนเก่งของเค้า</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family:'Prompt',sans-serif;
    background:linear-gradient(160deg,#ffd6e8 0%,#ffb3d1 45%,#c9a7ff 100%);
    overflow-x:hidden;
  }
  .hearts { position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden; }
  .hearts span {
    position:absolute; bottom:-60px; color:#ff5c8a; user-select:none;
    animation:rise linear infinite; opacity:.75;
  }
  @keyframes rise {
    0%   { transform:translateY(0) rotate(0deg);  opacity:.8; }
    100% { transform:translateY(-110vh) rotate(360deg); opacity:0; }
  }
  .wrap { position:relative; z-index:2; min-height:100vh; display:flex; flex-direction:column;
          align-items:center; justify-content:center; text-align:center; padding:30px 18px; }
  .badge {
    background:rgba(255,255,255,.85); color:#d6336c; font-weight:600; font-size:.95rem;
    padding:8px 22px; border-radius:100px; box-shadow:0 6px 18px rgba(0,0,0,.08); letter-spacing:.5px;
  }
  h1 {
    font-size:clamp(2.2rem,7vw,4.2rem); font-weight:800; color:#fff; margin-top:18px;
    text-shadow:0 4px 0 rgba(214,51,108,.35), 0 8px 30px rgba(0,0,0,.15);
    line-height:1.15;
  }
  h1 .heart { display:inline-block; animation:beat 1s infinite; }
  @keyframes beat { 0%,100%{transform:scale(1);} 30%{transform:scale(1.25);} 60%{transform:scale(1.05);} }
  .name {
    margin-top:10px; font-weight:600; color:#fff; font-size:clamp(1rem,3.5vw,1.5rem);
    background:linear-gradient(90deg,#ff5c8a,#b44dff,#ff5c8a); background-size:200% auto;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-fill-color:transparent; animation:shine 3s linear infinite;
  }
  @keyframes shine { to { background-position:200% center; } }
  .cake-area { margin:46px 0 22px; }
  .cake { position:relative; width:230px; height:180px; margin:0 auto; cursor:pointer;
          animation:bob 2.5s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
  .plate { position:absolute; bottom:0; left:50%; transform:translateX(-50%);
           width:250px; height:18px; border-radius:50%; background:linear-gradient(180deg,#ffffff,#e6e6e6);
           box-shadow:0 10px 20px rgba(0,0,0,.15); }
  .layer { position:absolute; left:50%; transform:translateX(-50%); border-radius:12px 12px 6px 6px; width:230px;
           box-shadow:inset 0 -14px 0 rgba(0,0,0,.06); }
  .l1 { bottom:16px; height:54px; background:linear-gradient(180deg,#fff1f5,#ffc2d9); }
  .l2 { bottom:64px; height:52px; background:linear-gradient(180deg,#ffd6ec,#ff9ecb); width:196px; }
  .l3 { bottom:110px; height:46px; background:linear-gradient(180deg,#ffbdec,#ff79b8); width:162px; }
  .drip { position:absolute; bottom:0; width:22px; height:16px; border-radius:0 0 12px 12px; background:rgba(255,255,255,.85); }
  .candle { position:absolute; bottom:132px; width:12px; height:34px; transform:translateX(-50%); z-index:2; }
  .flame { position:absolute; top:-18px; left:50%; transform:translateX(-50%);
           width:16px; height:22px; background:radial-gradient(circle at 50% 70%, #fff7ae 30%, #ffcf5c 55%, #ff8a3c 80%);
           border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
           animation:flick .25s ease-in-out infinite alternate; transform-origin:50% 100%; }
  @keyframes flick { from{transform:translateX(-50%) scaleX(1) rotate(-3deg);} to{transform:translateX(-50%) scaleX(.85) rotate(4deg);} }
  .smoke { position:absolute; top:-22px; left:50%; width:14px; height:14px; border-radius:50%;
    background:rgba(205,205,220,.55); filter:blur(1px); opacity:0; transition:opacity .5s; }
  .smoke::after { content:''; position:absolute; top:4px; left:3px; width:10px; height:10px;
    border-radius:50%; background:rgba(205,205,220,.45); }
  .blown .flame { opacity:0; animation:none; transition:opacity .3s; }
  .blown .smoke { opacity:1; animation:smoke 2.5s ease-out infinite; }
  @keyframes smoke { 0%{transform:translate(-50%,0) scale(.6);} 100%{transform:translate(-50%,-55px) scale(2);} }
  .hint {
    margin-top:14px; color:#8a2f55; font-size:.9rem; background:rgba(255,255,255,.7);
    padding:8px 18px; border-radius:100px; display:inline-block;
  }
  .mail { display:none; position:relative; width:min(640px,100%); margin-top:26px; }
  .mail.show { display:block; }
  .envelope { position:relative; width:min(420px,88%); height:240px; margin:0 auto; cursor:pointer; }
  .env-pocket { position:absolute; inset:0; background:linear-gradient(180deg,#fff0f5,#ffc2d9);
    border-radius:10px; overflow:hidden; box-shadow:0 14px 30px rgba(214,51,108,.25); }
  .env-pocket::before { content:''; position:absolute; left:0; right:0; bottom:0; height:55%;
    background:linear-gradient(180deg,#ffb7d4,#ff8fb8); clip-path:polygon(0 0,50% 100%,100% 0); }
  .env-flap { position:absolute; left:0; right:0; top:0; height:55%; z-index:2;
    background:linear-gradient(180deg,#ffc8de,#ff9ecb); clip-path:polygon(0 0,100% 0,50% 100%);
    transform-origin:top; transition:transform .55s cubic-bezier(.6,.05,.3,1); }
  .mail.open .env-flap { transform:rotateX(178deg); }
  .mail.open .envelope { opacity:0; height:0; transition:opacity .35s ease, height .5s ease .3s; }
  .env-stamp { position:absolute; top:44%; left:50%; transform:translate(-50%,-50%); z-index:3;
    font-size:2.3rem; filter:drop-shadow(0 3px 6px rgba(0,0,0,.2)); }
  .envelope .env-hint { position:absolute; top:76%; left:0; right:0; text-align:center; z-index:3;
    color:#7c2450; font-weight:700; font-size:.92rem; }
  .card {
    display:none; margin:-54px auto 0; max-width:640px; width:100%;
    background:rgba(255,255,255,.95); border-radius:24px; padding:30px 26px;
    box-shadow:0 20px 50px rgba(0,0,0,.14); text-align:left; border:2px solid #ff5c8a44;
  }
  .mail.open .card { display:block; animation:slideUp .8s cubic-bezier(.2,1,.3,1) .05s both; }
  @keyframes slideUp { from{transform:translateY(70px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  @keyframes pop { from{transform:scale(.7); opacity:0;} to{transform:scale(1); opacity:1;} }
  .card h2 { color:#d6336c; font-weight:800; margin-bottom:12px; font-size:1.4rem; }
  .card p { color:#5a3b4c; line-height:1.9; font-size:1.02rem; }
  .card .msg { min-height:120px; }
  .photo-frame {
    display:none; max-width:280px; margin:0 auto 18px; background:#fff; padding:10px 10px 6px;
    border-radius:10px; box-shadow:0 12px 30px rgba(0,0,0,.15); transform:rotate(-2deg); touch-action:pan-y;
  }
  .photo-frame img { width:100%; aspect-ratio:4/5; object-fit:cover; display:block; border-radius:6px; transition:opacity .3s; }
  .photo-frame .cap { text-align:center; color:#b03a66; font-size:.85rem; padding-top:8px; font-weight:600; }
  .nav { display:flex; align-items:center; justify-content:center; gap:12px; margin-top:8px; color:#b03a66; }
  .nav button { background:#ffd6e8; border:none; color:#d6336c; width:32px; height:32px; border-radius:50%;
    font-size:1rem; cursor:pointer; font-weight:800; }
  .nav button:active { transform:scale(.9); }
  #counter { font-size:.8rem; font-weight:600; min-width:52px; text-align:center; }
  .card .type { color:#333; }
  .card .type::after { content:'|'; color:#ff5c8a; animation:blink .8s infinite; }
  .card .msg { text-align:center; white-space:pre-line; min-height:120px; }
  @keyframes blink { 50%{opacity:0;} }
  .footer { margin-top:26px; color:#fff; font-size:.85rem; text-shadow:0 2px 6px rgba(0,0,0,.2); }
  .confetti { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:5; overflow:hidden; }
  .confetti i { position:absolute; top:-20px; opacity:0; }
  .fall { animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); } }
  #heartScreen { position:fixed; inset:0; z-index:7; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:linear-gradient(160deg,#ffd6e8 0%,#ffb3d1 45%,#c9a7ff 100%);
    transition:opacity .45s ease, transform .45s ease, visibility 0s .5s;
    touch-action:none; user-select:none; cursor:pointer; will-change:transform, opacity; }
  #heartScreen.done { opacity:0; transform:scale(1.08); pointer-events:none; visibility:hidden; }
  .hf-badge { background:rgba(255,255,255,.85); color:#d6336c; font-weight:600;
    padding:8px 20px; border-radius:100px; font-size:.9rem; }
  #hfSvg { width:clamp(190px,60vw,260px); filter:drop-shadow(0 12px 30px rgba(214,51,108,.35));
    animation:bob 2s ease-in-out infinite; margin-top:22px; }
  #hfSvg.tap { animation:hearta .28s cubic-bezier(.2,1.4,.4,1); }
  @keyframes hearta { 35% { transform:scale(1.12); } }
  #hfSvg.filled { animation:heartfull 1.2s 2; }
  @keyframes heartfull { 0%,100%{transform:scale(1);} 30%{transform:scale(1.18);} 55%{transform:scale(1.05);} 75%{transform:scale(1.14);} }
  #hfLabel { margin-top:24px; color:#7c2450; font-weight:600; font-size:1.05rem; line-height:1.8;
    background:rgba(255,255,255,.6); padding:8px 20px; border-radius:100px; }
  .hf-sub { margin-top:10px; color:#fff; font-weight:600; font-size:.95rem; text-shadow:0 2px 8px rgba(0,0,0,.25); }
  .hf-btn { margin-top:20px; font-family:'Prompt',sans-serif; font-size:1.05rem; font-weight:700;
    color:#fff; background:linear-gradient(135deg,#ff5c8a,#ff2e63); border:none; border-radius:100px;
    padding:13px 36px; cursor:pointer; box-shadow:0 10px 26px rgba(214,51,108,.4);
    transition:transform .1s, opacity .15s; }
  .hf-btn:active { transform:scale(.93); }
  .hf-sweet { margin-top:14px; color:#fff; font-weight:600; font-size:.95rem;
    text-shadow:0 2px 8px rgba(0,0,0,.25); min-height:1.2em; line-height:1.6; }
  .fly-heart { position:fixed; z-index:8; pointer-events:none; user-select:none;
    animation:flyup .95s ease-out forwards; text-shadow:0 4px 14px rgba(214,51,108,.45); }
  @keyframes flyup { 0% { transform:translate(0,0) scale(.7); opacity:0; }
    15% { opacity:1; }
    100% { transform:translate(var(--dx,-30px),-230px) scale(1.28); opacity:0; } }
  .env-sec { display:none; margin-top:22px; text-align:center; }
  .env-sec.visible { display:block; animation:pop .5s cubic-bezier(.2,1.4,.4,1); }
  .env-title { color:#b03a66; font-weight:600; margin-bottom:14px; line-height:1.8; }
  .env-row { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
  .env { position:relative; width:118px; height:80px; background:linear-gradient(180deg,#ff9ecb,#ff5c8a);
    border:none; border-radius:8px; cursor:pointer; transition:transform .25s, opacity .4s;
    box-shadow:0 8px 20px rgba(214,51,108,.3); }
  .env::after { content:''; position:absolute; bottom:0; left:0; right:0; height:40%;
    background:rgba(255,255,255,.18); border-radius:0 0 8px 8px; }
  .env::before { content:''; position:absolute; top:0; left:0; right:0; height:44%; background:#e94f83;
    clip-path:polygon(0 0,50% 100%,100% 0); }
  .env .seal { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:1.3rem;
    z-index:2; filter:drop-shadow(0 2px 3px rgba(0,0,0,.2)); }
  .env:active { transform:scale(.94); }
  .env.gone { opacity:.35; pointer-events:none; }
  .env.open { animation:envpop .6s forwards; pointer-events:none; }
  @keyframes envpop { 0%{transform:rotate(0)} 30%{transform:rotate(-6deg) scale(1.08)}
    60%{transform:rotate(4deg) scale(1.05)} 100%{transform:rotate(0) scale(.9); opacity:0;} }
  .env-out { display:none; margin-top:14px; }
  .env-out.show { display:block; animation:pop .6s .25s cubic-bezier(.2,1.4,.4,1) both; }
  .env-paper { background:#fff8fb; border:1px dashed #ff5c8a; border-radius:16px; padding:22px 20px;
    color:#a12b5c; font-weight:600; line-height:1.9; box-shadow:0 10px 24px rgba(214,51,108,.18); margin:0 auto; }
  @media (max-width:420px){ .cake{transform:scale(.9);} .cake-area{margin:30px 0 8px;} }
</style>
</head>
<body>
<div class="hearts" id="hearts"></div>
<div class="confetti" id="confetti"></div>

<div id="heartScreen">
  <div class="hf-badge">&#127873; มีของให้อีกนิดนึง ...</div>
  <svg id="hfSvg" viewBox="0 0 100 100" aria-label="ส่งใจทีละดวง">
    <defs>
      <linearGradient id="hfGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ff8fb8"/>
        <stop offset="100%" stop-color="#ff2e63"/>
      </linearGradient>
      <clipPath id="hfClip"><path id="hfShape" d="M50 88 C 20 62, 6 44, 6 26 C 6 12, 19 4, 32 8 C 40 11, 46 17, 50 24 C 54 17, 60 11, 68 8 C 81 4, 94 12, 94 26 C 94 44, 80 62, 50 88 Z"/></clipPath>
    </defs>
    <g clip-path="url(#hfClip)">
      <rect id="hfFill" x="0" y="88" width="100" height="4" fill="url(#hfGrad)"/>
    </g>
    <path d="M50 88 C 20 62, 6 44, 6 26 C 6 12, 19 4, 32 8 C 40 11, 46 17, 50 24 C 54 17, 60 11, 68 8 C 81 4, 94 12, 94 26 C 94 44, 80 62, 50 88 Z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
  </svg>
  <div id="hfLabel">กดปุ่ม "ส่งใจ" ทีละดวง ...<br>หัวใจจะค่อย ๆ เต็มขึ้นเอง</div>
  <div class="hf-sub">เติมไปแล้ว <span class="pct">0</span>%</div>
  <button id="hfBtn" class="hf-btn" type="button">&#128149; ส่งใจ</button>
  <div id="hfSweet" class="hf-sweet"></div>
</div>

<div class="wrap">
  <div class="deadline" style="display:none;"></div>

  <div class="badge">&#127874; &nbsp;แค่สำหรับคนพิเศษ &nbsp;&#10084;</div>
  <h1>HAPPY BIRTHDAY <span class="heart">&#128151;</span></h1>
  <div class="name">สุขสันต์วันเกิดนะครับคนเก่งของเค้า : )</div>

  <div class="cake-area">
    <div class="cake" id="cake" title="กดที่เค้กเพื่อเป่าเทียน">
      <div class="candle" style="left:30%; background:linear-gradient(180deg,#ffd6e8,#ff8fb8);">
        <div class="flame"></div><div class="smoke"></div>
      </div>
      <div class="candle" style="left:50%; background:linear-gradient(180deg,#ffd6e8,#ff8fb8);">
        <div class="flame"></div><div class="smoke"></div>
      </div>
      <div class="candle" style="left:70%; background:linear-gradient(180deg,#ffd6e8,#ff8fb8);">
        <div class="flame"></div><div class="smoke"></div>
      </div>
      <div class="drip" style="left:12px;"></div>
      <div class="drip" style="left:70px;"></div>
      <div class="drip" style="left:120px;"></div>
      <div class="drip" style="right:12px;"></div>
      <div class="layer l1"></div>
      <div class="layer l2"></div>
      <div class="layer l3"></div>
      <div class="plate"></div>
    </div>
    <div class="hint">&#127919; กดที่เค้กเพื่อเป่าเทียน</div>
  </div>

  <div class="mail" id="mail">
    <div class="envelope" id="envelope">
      <div class="env-pocket"></div>
      <div class="env-flap"></div>
      <div class="env-stamp">&#128140;</div>
      <div class="env-hint">แตะที่ซองเพื่อเปิดการ์ด</div>
    </div>

    <div class="card" id="card">
    <h2>&#127873; ถึงคนเก่งของเค้า</h2>
    <div class="photo-frame" id="photoFrame">
      <img id="photo" alt="รูปของเรา">
      <div class="nav">
        <button onclick="sw(-1)">&#10094;</button>
        <span id="counter"></span>
        <button onclick="sw(1)">&#10095;</button>
      </div>
      <div class="cap">&#10084;</div>
    </div>
    <audio id="song" loop preload="auto"><source src="music.mp3" type="audio/mpeg"></audio>
    <div class="msg"><span class="type"></span></div>
    <div class="env-sec" id="envSec">
      <div class="env-title">ของปิดท้าย ... กดเปิดซองมาดูเลย &#128158;</div>
      <div class="env-row" id="envRow">
        <button class="env" type="button"><span class="seal">&#128140;</span></button>
        <button class="env" type="button"><span class="seal">&#128140;</span></button>
        <button class="env" type="button"><span class="seal">&#128140;</span></button>
      </div>
      <div class="env-out" id="envOut"><div class="env-paper"><span class="env-msg"></span></div></div>
    </div>
    </div>
  </div>

</div>

<script>
(function () {
  var PHOTOS = ['small/A6CC14E9-B77E-4F77-9DFF-4466A64B7938.jpg','small/043F4855-EC53-481B-93DC-E9F82A57AF13.jpg','small/13C85BE7-B3B6-4CA3-861F-D814B94ACF16.jpg','small/292FB56B-DBEC-4D37-AD51-E13E961AEE9D.jpg','small/ACF132FA-2CCD-4568-BBCA-788ADA816D30.jpg','small/5E421F13-1695-4B9E-B3D3-5F2DC83E60A1.jpg','small/890F276E-BE73-4668-B4D6-D2A80E736D2E.jpg','small/0E230529-0B7A-461D-AE06-21F966F898F5.jpg','small/DFDFF110-9A1B-4131-84F9-125C5893C911.jpg','small/D3FEE3CC-A0CD-455A-B80F-9D22AD377B61.jpg'];
  var photoEl = document.getElementById('photo');
  var frame = document.getElementById('photoFrame');
  var idx = 0;
  var preloaded = [];
  function preload(i){
    var k = ((i % PHOTOS.length) + PHOTOS.length) % PHOTOS.length;
    if (!preloaded[k]) { preloaded[k] = new Image(); preloaded[k].src = PHOTOS[k]; }
  }
  function show() {
    if (!photoEl) return;
    if (preloaded[idx] && preloaded[idx].complete) {
      photoEl.src = preloaded[idx].src;
      photoEl.style.opacity = 1;
    } else {
      photoEl.style.opacity = 0;
      photoEl.src = PHOTOS[idx];
    }
    var c = document.getElementById('counter');
    if (c) c.textContent = (idx + 1) + ' / ' + PHOTOS.length;
  }
  for (var pi = 0; pi < PHOTOS.length; pi++) preload(pi);
  if (photoEl) {
    photoEl.onload = function(){ if (frame) frame.style.display = 'block'; photoEl.style.opacity = 1; };
    photoEl.onerror = function(){ if (frame) frame.style.display = 'none'; };
  }
  window.sw = function(d){ idx = (idx + d + PHOTOS.length) % PHOTOS.length; show(); };
  if (frame) {
    var startX = 0;
    frame.addEventListener('touchstart', function(e){ startX = e.touches[0].clientX; }, {passive:true});
    frame.addEventListener('touchend', function(e){
      var dx = e.changedTouches[0].clientX - startX;
      if (Math.abs(dx) > 45) window.sw(dx < 0 ? 1 : -1);
    }, {passive:true});
  }
  window.sw(0);
  var EMOJIS = ['&#10084;','&#10084;&#65039;','&#129505;','&#128149;','&#127873;','&#127881;','&#128150;'];
  var hearts = document.getElementById('hearts');
  for (var i = 0; i < 26; i++) {
    var s = document.createElement('span');
    s.innerHTML = EMOJIS[i % EMOJIS.length];
    var size = 14 + Math.random() * 26;
    s.style.fontSize = size + 'px';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = (9 + Math.random() * 10) + 's';
    s.style.animationDelay = (Math.random() * 8) + 's';
    hearts.appendChild(s);
  }

  var MESSAGE = 'สุขสันต์วันเกิดนะครับคนเก่งของเค้า : )\n❤️🎂\nขอบคุณนะที่เกิดมาให้เค้าได้รู้จักเธอ\nแค่มีเธออยู่ในชีวิต\nวันธรรมดาๆ ของเค้าก็กลายเป็นวันที่พิเศษขึ้นมากแล้ว\nขอให้เธอมีความสุขมากๆ ยิ้มเยอะๆ\nสมหวังในทุกเรื่องที่ตั้งใจไว้นะ\nไม่ว่าจะเจอเรื่องอะไร\nก็อยากให้รู้ไว้ว่ายังมีเค้าอยู่ตรงนี้เสมอ\nมีอะไรไม่สบายใจ หรืออยากเล่าอะไร\nก็มาบอกเค้าได้ตลอดเลยนะ\nเค้าอาจจะไม่ได้ทำให้ทุกวันของเธอดีที่สุดได้\nแต่เค้าจะพยายามทำให้เธอมีความสุข\nให้มากที่สุดเท่าที่เค้าจะทำได้\nและจะเป็นกำลังใจให้เธอเสมอนะครับ\nคนเก่งของเค้า : )';

  var card = document.getElementById('card');
  var typeEl = card.querySelector('.type');
  var blown = false;
  var typed = false;

  var cake = document.getElementById('cake');
  function blowOut() {
    if (blown) return;
    blown = true;
    cake.classList.add('blown');
    cake.style.cursor='default';
    var hint = document.querySelector('.hint');
    if (hint) hint.textContent = '\uD83C\uDF89 เป่าเทียนแล้ว! แตะที่ซองเพื่ออ่านคำอวยพร';

    var song = document.getElementById('song');
    if (song) { song.currentTime = 0; song.play().catch(function(){}); }

    document.querySelectorAll('.flame').forEach(function(f){ f.style.opacity=0; });

    if (navigator.vibrate) { try { navigator.vibrate(80); } catch(e){} }
    setTimeout(function(){
      var mail = document.getElementById('mail');
      if (mail) mail.classList.add('show');
    }, 650);
    setTimeout(launchConfetti, 350);
    setTimeout(launchConfetti, 900);
    setTimeout(launchConfetti, 1500);
  }

  var envelope = document.getElementById('envelope');
  if (envelope) envelope.addEventListener('click', function(){
    var mail = document.getElementById('mail');
    if (!mail || mail.classList.contains('open')) return;
    mail.classList.add('open');
    if (navigator.vibrate) { try { navigator.vibrate(40); } catch(e){} }
    if (!typed) { typed = true; typeMessage(); }
  });

  cake.addEventListener('click', blowOut);

  function typeMessage(){
    var i = 0;
    var full = MESSAGE;
    (function tick(){
      if (i < full.length) {
        typeEl.textContent = full.slice(0, ++i);
        setTimeout(tick, 22);
      } else {
        typeEl.classList.remove('type');
        var es = document.getElementById('envSec');
        if (es) es.classList.add('visible');
      }
    })();
  }

  function launchConfetti(){
    var box = document.getElementById('confetti');
    var emojis = ['\uD83D\uDC97','\uD83D\uDC9E','\uD83C\uDF89','\uD83D\uDC96','\uD83C\uDFC1','\uD83D\uDC98','\u2728'];
    for (var i = 0; i < 40; i++) {
      var el = document.createElement('i');
      el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      el.style.left = Math.random()*100 + 'vw';
      el.style.fontSize = (14 + Math.random()*20) + 'px';
      var dur = 2.2 + Math.random()*2;
      el.style.animation = 'fall '+dur+'s '+(Math.random()*0.4)+'s linear forwards';
      box.appendChild(el);
(function(e){ setTimeout(function(){ e.remove(); }, (dur+1)*1000); })(el);
    }
  }

  var ENVS = [
    '\uD83D\uDE1A จุ๊บเหม่ง 1 ที! (เอาไปเบิกกับเค้าได้เลย \u2014 นัดเวลาได้ทุกเมื่อ)',
    '\uD83D\uDE1A จุ๊บเหม่ง 1 ที! (เอาไปเบิกกับเค้าได้เลย \u2014 นัดเวลาได้ทุกเมื่อ)',
    '\uD83D\uDE1A จุ๊บเหม่ง 1 ที! (เอาไปเบิกกับเค้าได้เลย \u2014 นัดเวลาได้ทุกเมื่อ)'
  ];
  var envSec = document.getElementById('envSec');
  var envRow = document.getElementById('envRow');
  var envMsg = document.querySelector('.env-msg');
  var envOpened = false;
  if (envSec && envRow) {
    var order = [0,1,2].sort(function(){ return Math.random() - 0.5; });
    var btns = envRow.querySelectorAll('.env');
    for (var ei = 0; ei < btns.length; ei++) {
      (function(btn, text){
        btn.addEventListener('click', function(){
          if (envOpened) return;
          envOpened = true;
          btn.classList.add('open');
          [].forEach.call(envRow.querySelectorAll('.env:not(.open)'), function(b){ b.classList.add('gone'); });
          if (envMsg) envMsg.textContent = text;
          var out = document.getElementById('envOut');
          if (out) out.classList.add('show');
          if (text === ENVS[0]) { launchConfetti(); launchConfetti(); }
        });
      })(btns[ei], ENVS[order[ei]]);
    }
  }

  var hfScreen = document.getElementById('heartScreen');
  var hfFill = document.getElementById('hfFill');
  var hfLabel = document.getElementById('hfLabel');
  var pctEl = document.querySelector('#heartScreen .pct');
  var hfBtn = document.getElementById('hfBtn');
  var hfSweetEl = document.getElementById('hfSweet');
  var SWEET = [
    'ทุกทีที่กด คือ "รักนะ" อีกใบหนึ่ง 💌',
    'กดไปอีกทีสิ รู้ว่าเธอน่ารักอยู่ 😌',
    'หัวใจใบนี้รับความรักจากเธอได้ไม่จำกัด 💗',
    'ใกล้เต็มแล้ว ... ของจริงยังอีกตั้งเยอะ 😇',
    'อีกแค่ไม่กี่ทีเอง เธอทำได้อยู่แล้ว 💖',
    'เค้าแอบเห็นว่าเธอกำลังยิ้มตอนกด น่ารักมาก 😊',
    'ใครบอกให้กดเร็ว ๆ เค้ามีของขวัญส่งใจหลาย ๆ ดวง 💖',
    'อีกนิดเดียว หัวใจใหญ่จะบอกว่า รักเธอมากแค่ไหน 💓'
  ];
  var hfDone = false, hfP = 0, hfTaps = 0;
  var HF_TOP = 4, HF_BOTTOM = 88, HF_TOTAL = 29;
  function hfDraw(){
    if (hfFill) {
      var h = HF_TOP + (HF_BOTTOM - HF_TOP) * hfP;
      hfFill.setAttribute('y', HF_BOTTOM - h);
      hfFill.setAttribute('height', h);
    }
    if (pctEl) pctEl.textContent = Math.round(hfP * 100);
  }
  function hfPop(){
    var svg = document.getElementById('hfSvg');
    if (!svg) return;
    svg.classList.remove('tap');
    void svg.getBoundingClientRect();
    svg.classList.add('tap');
  }
  function hfFly(){
    var r = hfBtn ? hfBtn.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight * 0.6, width: 0 };
    var h = document.createElement('span');
    h.className = 'fly-heart';
    h.textContent = (Math.random() < 0.5) ? '\uD83D\uDC97' : '\uD83D\uDC9E';
    h.style.left = (r.left + Math.random() * Math.max(r.width, 1)) + 'px';
    h.style.top = (r.top - 8) + 'px';
    h.style.fontSize = (15 + Math.random() * 12) + 'px';
    h.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px');
    document.body.appendChild(h);
    (function(el){ setTimeout(function(){ el.remove(); }, 1000); })(h);
  }
  function hfSend(){
    if (hfDone) return;
    hfTaps++;
    hfP = Math.min(1, hfTaps / HF_TOTAL);
    hfDraw();
    hfPop();
    hfFly();
    if (hfSweetEl && SWEET.length) {
      var s = SWEET[Math.floor(Math.random() * SWEET.length)];
      if (s === hfSweetEl.dataset.last) s = SWEET[(SWEET.indexOf(s) + 1) % SWEET.length];
      hfSweetEl.dataset.last = s;
      hfSweetEl.textContent = s;
    }
    if (hfP >= 1) hfComplete();
  }
  function hfComplete(){
    hfDone = true;
    if (hfBtn) hfBtn.style.display = 'none';
    if (hfSweetEl) hfSweetEl.textContent = '';
    var svg = document.getElementById('hfSvg');
    if (svg) { svg.classList.remove('tap'); svg.classList.add('filled'); }
    if (hfLabel) hfLabel.textContent = '\uD83D\uDC96 หัวใจเต็มดวงแล้ว รักเธอมากที่สุดเลย!';
    launchConfetti();
    setTimeout(function(){ if (hfScreen) hfScreen.classList.add('done'); }, 5000);
  }
  if (hfBtn) hfBtn.addEventListener('click', hfSend);
  var hfSvgEl = document.getElementById('hfSvg');
  if (hfSvgEl) hfSvgEl.addEventListener('click', hfSend);
  if (hfScreen) {
    hfScreen.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  }
})();
</script>
</body>
</html>
